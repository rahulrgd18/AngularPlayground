<div class="container mt-3">
  <!-- Top Controls -->
  <div class="row mb-3 text-center align-items-center">
    <!-- Previous Month -->
    <div class="col">
      <button class="btn btn-outline-secondary" (click)="prevMonth()">
        <i class="bi bi-chevron-left"></i>
      </button>
    </div>

    <!-- Month Selector -->
    <div class="col">
      <select
        class="form-select"
        [(ngModel)]="selectedMonth"
        aria-label="Select month"
        (change)="updateCalendar()"
      >
        <option *ngFor="let month of months; let i = index" [value]="i">
          {{ month }}
        </option>
      </select>
    </div>

    <!-- Year Input -->
    <div class="col">
      <input
        type="number"
        class="form-control"
        [(ngModel)]="selectedYear"
        (change)="updateCalendar()"
      />
    </div>

    <!-- Next Month -->
    <div class="col">
      <button class="btn btn-outline-secondary" (click)="nextMonth()">
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>

  <!-- Week Days Header -->
  <div class="row text-center fw-bold border-bottom pb-2">
    <div class="col" *ngFor="let day of weekDays">{{ day }}</div>
  </div>

  <!-- Calendar Dates Grid -->
  <div class="calendar-grid mt-2">
    <div class="row" *ngFor="let week of calendarMatrix">
      <div
        class="col text-center border py-2"
        *ngFor="let date of week"
        [class.text-muted]="!date"
        (click)="date && openDateModal(date)"
      >
        {{ date || "" }}
      </div>
    </div>
  </div>
</div>

<!-- Date Modal -->
<div
  class="modal fade"
  id="dateModal"
  tabindex="-1"
  aria-labelledby="dateModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">
      <div class="modal-header">
        <h5 class="modal-title" id="dateModalLabel">
          Add for {{ selectedDateDisplay }}
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <div class="d-grid gap-3">
          <a routerLink="/todo" class="btn btn-outline-primary">Todo</a>
          <a routerLink="/notes" class="btn btn-outline-success">Notes</a>
          <a routerLink="/pomodoro" class="btn btn-outline-danger">Pomodoro</a>
        </div>
      </div>
    </div>
  </div>
</div>
